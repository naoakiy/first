<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Love You is To Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
</head>
<body 
    style="
        background-image: url(https://images.unsplash.com/photo-1521489871110-81dc5a61dbda?q=80&w=1528&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);"
    class="flex justify-center h-screen items-center"
    >
    
    <div 
        class="bg-white border px-10 py-8 border-4 border-gray-300 shadow-lg shadow-brown-300 rounded-xl flex flex-col items-center justify-center text-center 
        animate__animated animate__fadeInUpBig m-8 w-80" id="kartu" 
    
        <h1 class="text-2xl">To Love You is To Live</h1>
        <h1 class="text-4xl text-gray-500 font-bold flex justify-center animate__animated animate__pulse animate__infinite">Untuk Kakak</h1>
        <button 
            class="mt-5 px-4 py-2 p-2 bg-black text-white rounded hover:bg-gray-900 transition ease-in 
            w-full animate__animated animate__tada animate__delay-1s" 
            onclick="ubahKartu()"
            >
            klik disini yaa ˶ᵔ ᵕ ᵔ˶
        </button>
    </div>
   
    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.1.0/dist/confetti.min.js"></script>
    <audio id="lagu" src="https://raw.githubusercontent.com/naoakiy/kekal/main/kekal.mp3"></audio>
    <script>
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
        });
        let kartu = document.getElementById("kartu");
        let lagu = document.getElementById("lagu");
        function ubahKartu() {
             lagu.play();
            kartu.innerHTML = `         <h1 class="font-semibold text-wrap animate__animated animate__zoomIn">
        hi kakak, thank you for loving me this deeply. aku harap kita bisa bareng terus, no matter what happens in the future. aku akan selalu support kakak, i'll always be there for you kakak. cape yaa tiap hari kerja, my heart hurts when i hear kakak nangis pas pulang kerja saking capenya... aku rasanya kayak pengen hug uuu tightly kakak. aku pengen pat pat kakak dan bilang, "you did well today, and you'll always be the best".
    </h1>
     <h2 class="mt-3 animate__animated animate__fadeIn">
        - From : Nao -
        </h2>
    <button 
        class="mt-5 px-4 py-2 p-2 bg-black text-white rounded hover:bg-gray-900 transition ease-in 
        w-full animate__animated animate__tada animate__delay-1s" 
        onclick="refresh()"
        >
        understood!
    </button>
    `;
        }
         function refresh(){
        location.reload();
        }
    </script>
  
</body>
</html>
